name: Python Matrix

on:
  push:

jobs:
  test-python:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

        exclude:
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Show operating system
        run: echo "Running on ${{ matrix.os }}"

      - name: Intentional failure
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        run: exit 1